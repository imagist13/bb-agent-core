[package]
name = "bb-team"
version.workspace = true
edition.workspace = true

[dependencies]
bb-common.workspace = true
bb-db.workspace = true
bb-project.workspace = true
bb-api-types.workspace = true
bb-realtime.workspace = true
bb-ai-agent.workspace = true
bb-team-prompts.workspace = true
bb-auth.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
dashmap.workspace = true
regex.workspace = true
agent-client-protocol = "2.0.0"
futures-util.workspace = true

[dev-dependencies]
sqlx.workspace = true
tokio = { workspace = true, features = ["test-util"] }
futures-util.workspace = true
reqwest.workspace = true
tempfile.workspace = true
# Capture structured tracing fields so the AC11 recognition-log test can assert
# the info log carries the command NAME/source but never the raw content/args.
tracing-subscriber.workspace = true
# Enable the `AgentInstance::Mock` variant so tests can build fake agents
# through the trait-object escape hatch without spawning real CLI processes.
bb-ai-agent = { workspace = true, features = ["test-support"] }
