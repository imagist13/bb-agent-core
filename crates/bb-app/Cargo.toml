[package]
name = "bb-app"
version.workspace = true
edition.workspace = true
exclude = ["data/**"]

[[bin]]
name = "bbcore"
path = "src/main.rs"

[features]
default = ["telegram", "lark", "dingtalk", "weixin", "slack", "discord"]
telegram = ["bb-channel/telegram"]
lark = ["bb-channel/lark"]
dingtalk = ["bb-channel/dingtalk"]
weixin = ["bb-channel/weixin"]
slack = ["bb-channel/slack"]
discord = ["bb-channel/discord"]

[dependencies]
bb-common.workspace = true
bb-assets.workspace = true
bb-db.workspace = true
bb-api-types.workspace = true
bb-realtime.workspace = true
bb-auth.workspace = true
bb-system.workspace = true
bb-file.workspace = true
bb-shell.workspace = true
bb-ai-agent.workspace = true
bb-session.workspace = true
bb-session-message.workspace = true
bb-skill-runtime.workspace = true
bb-mcp.workspace = true
bb-conversation.workspace = true
bb-extension.workspace = true
bb-channel.workspace = true
bb-team.workspace = true
bb-team-prompts.workspace = true
bb-cron.workspace = true
bb-project.workspace = true
bb-sidebar.workspace = true
bb-assistant.workspace = true
bb-runtime.workspace = true
bb-process.workspace = true
aion-config.workspace = true
axum.workspace = true
chrono.workspace = true
dirs.workspace = true
dunce.workspace = true
tokio.workspace = true
uuid.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
reqwest.workspace = true
rmcp = { version = "1.5", features = ["server", "transport-io", "schemars"] }
anyhow.workspace = true
async-trait.workspace = true
rpassword.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
bb-api-types.workspace = true
bb-realtime.workspace = true
# Enable the `AgentInstance::Mock` variant so tests can build fake agents
# through the trait-object escape hatch without spawning real CLI processes.
bb-ai-agent = { workspace = true, features = ["test-support"] }
base64.workspace = true
git2.workspace = true
http-body-util.workspace = true
sqlx = { workspace = true, features = ["migrate"] }
tempfile = "3"
tower = { workspace = true, features = ["util"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
wiremock = "0.6"
